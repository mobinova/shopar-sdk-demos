name: SDK demo hosts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - run: ./gradlew :app:assembleDebug
        working-directory: android

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: xcodebuild -resolvePackageDependencies -project ShoparSDKDemo.xcodeproj -scheme ShoparSDKDemo
        working-directory: ios
      - run: xcodebuild -quiet -project ShoparSDKDemo.xcodeproj -scheme ShoparSDKDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
